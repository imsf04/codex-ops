name: Codex Ops Windows validation
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-ops-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codex-ops-windows:
    name: Codex Ops Windows
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Use a canonical temporary directory
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:GITHUB_WORKSPACE 'ci-test-temp'
          New-Item -ItemType Directory -Force $testTemp | Out-Null
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
      - name: Install locked Python environment
        working-directory: packages/codex-ops
        run: |
          python -m pip install uv==0.11.32
          uv sync --locked
      - name: Prepare native host for integration tests
        shell: pwsh
        run: |
          $hostRoot = Join-Path $env:RUNNER_TEMP 'codex-native'
          New-Item -ItemType Directory -Force $hostRoot | Out-Null
          npm pack @openai/codex@0.165.0-alpha.1-win32-x64 --pack-destination $hostRoot --silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $hostRoot 'openai-codex-0.165.0-alpha.1-win32-x64.tgz'
          tar -xzf $archive -C $hostRoot 'package/vendor/x86_64-pc-windows-msvc/bin/codex.exe' 'package/vendor/x86_64-pc-windows-msvc/bin/codex-code-mode-host.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hostBin = Join-Path $hostRoot 'package/vendor/x86_64-pc-windows-msvc/bin'
          $hostBin >> $env:GITHUB_PATH
          "CODEX_APP_RUNTIME_CLI_PATH=$(Join-Path $hostBin 'codex.exe')" >> $env:GITHUB_ENV
          $runtimeParent = Join-Path $env:USERPROFILE '.local/share/codex-runtimes'
          New-Item -ItemType Directory -Force $runtimeParent | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $runtimeParent 'codex-ops-uv') -Target (Join-Path $env:GITHUB_WORKSPACE 'packages/codex-ops/.venv') | Out-Null
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.1
      - name: Build native worker and kernel
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path native/Cargo.toml --bin dsh-ops-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path packages/codex-ops/rust-kernel/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path packages/codex-ops/rust-kernel/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force packages/codex-ops/bin | Out-Null
          Copy-Item native/target/release/dsh-ops-worker.exe packages/codex-ops/bin/
          Copy-Item packages/codex-ops/rust-kernel/target/release/codex-ops-kernel.exe packages/codex-ops/bin/
          rustc --edition 2024 -O packages/codex-ops/runtime_bridge/shim.rs -o packages/codex-ops/bin/codex-ops-cli.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare frozen test design
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages/codex-ops/verification | Out-Null
          Copy-Item packages/codex-ops/tests/fixtures/v070-acceptance-design.json packages/codex-ops/verification/
      - name: Run Python tests
        working-directory: packages/codex-ops
        run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - name: Upload tested Windows binaries
        uses: actions/upload-artifact@v7
        with:
          name: codex-ops-windows-binaries
          path: packages/codex-ops/bin/*.exe
          if-no-files-found: error
          retention-days: 7
