name: Codex Ops validation
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-ops-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    name: Codex Ops dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest, macos-15-intel]
    defaults:
      run:
        working-directory: packages/codex-ops
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Use a canonical temporary directory
        run: >-
          python -c "import os,pathlib; p=(pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'ci-test-temp').resolve(); p.mkdir(exist_ok=True); f=open(os.environ['GITHUB_ENV'],'a'); f.write(''.join(k+'='+str(p)+'\n' for k in ('TEMP','TMP','TMPDIR'))); f.close()"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --locked
      - name: Import runtime dependencies
        run: uv run --locked python -c "import grpc, mcp.server, pydantic; print('Runtime dependencies loaded')"
      - name: Check native binary selection
        run: uv run --locked python -m unittest discover -s tests -p test_portable_binaries.py
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
            packages/codex-ops/rust-kernel/target
          key: codex-ops-portable-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'packages/codex-ops/rust-kernel/Cargo.lock') }}
      - name: Build and test native components
        shell: bash
        run: |
          cargo test --workspace --locked --manifest-path ../../native/Cargo.toml
          cargo build --locked --release --manifest-path ../../native/Cargo.toml --bin dsh-ops-worker
          cargo test --locked --manifest-path rust-kernel/Cargo.toml
          cargo build --locked --release --manifest-path rust-kernel/Cargo.toml
      - name: Stage native components
        run: >-
          python -c "import os, pathlib, shutil; ext = '.exe' if os.name == 'nt' else ''; dest = pathlib.Path('bin'); dest.mkdir(exist_ok=True); shutil.copy2(pathlib.Path('../../native/target/release') / ('dsh-ops-worker' + ext), dest); shutil.copy2(pathlib.Path('rust-kernel/target/release') / ('codex-ops-kernel' + ext), dest)"
      - name: Build Windows launcher
        if: runner.os == 'Windows'
        run: rustc --edition 2024 -O runtime_bridge/shim.rs -o bin/codex-ops-cli.exe
      - name: Exercise native worker and kernel
        run: uv run --locked python -m unittest discover -s tests -p test_portable_native.py
      - name: Check native kernel behavior and deadlines
        run: uv run --locked python -m unittest discover -s tests -p test_v080_kernel.py
      - name: Check concurrent event accounting
        run: uv run --locked python -m unittest discover -s tests -p test_v080_cost_events.py
      - name: Exercise MCP stdio server
        run: uv run --locked python -m unittest discover -s tests -p test_portable_startup.py
      - name: Check process ancestry and runtime status
        run: uv run --locked python -m unittest discover -s tests -p test_runtime_status.py
      - name: Check runtime discovery
        run: uv run --locked python -m unittest discover -s tests -p test_v061_runtime_discovery.py
      - name: Check loopback relay with a configured HTTP proxy
        run: uv run --locked python -m unittest discover -s tests -p test_grpc_relay_proxy.py
      - name: Check POSIX launcher lifecycle
        if: runner.os != 'Windows'
        run: uv run --locked python -m unittest discover -s tests -p test_posix_launcher.py
      - name: Check bridge manager lifecycle
        run: uv run --locked python -m unittest discover -v -s tests -p test_lifecycle_architecture.py
      - name: Check hook behavior
        run: uv run --locked python -m unittest discover -s tests -p test_hook_architecture.py
      - name: Check read-only snapshot safety
        run: uv run --locked python -m unittest discover -s tests -p test_cache_reader.py
      - name: Check bundle assembly
        run: uv run --locked python -m unittest discover -s tests -p test_portable_bundle.py
      - name: Fetch pinned Codex CLI for isolated installation
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Windows-X64) target=win32-x64 ;;
            Linux-X64) target=linux-x64 ;;
            macOS-ARM64) target=darwin-arm64 ;;
            macOS-X64) target=darwin-x64 ;;
            *) exit 1 ;;
          esac
          npm pack "@openai/codex@0.165.0-alpha.1-${target}" --pack-destination "$RUNNER_TEMP" --silent
      - name: Prepare native host for full integration tests
        shell: bash
        run: uv run --locked python tests/prepare_native_ci.py "$RUNNER_TEMP" "$RUNNER_TEMP/codex-native"
      - name: Prepare frozen test design
        run: python -c "import pathlib,shutil; pathlib.Path('verification').mkdir(exist_ok=True); shutil.copy2('tests/fixtures/v070-acceptance-design.json', 'verification/')"
      - name: Build and verify relocated preview bundle
        shell: bash
        run: uv run --locked python tests/check_portable_bundle.py "$RUNNER_TEMP/codex-ops-preview" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        with:
          name: codex-ops-preview-${{ matrix.os }}
          path: ${{ runner.temp }}/codex-ops-preview/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: codex-ops-native-${{ matrix.os }}
          path: packages/codex-ops/bin/
          if-no-files-found: error
          retention-days: 7

      - name: Run full Python suite
        run: uv run --locked python -m unittest discover -s tests

  source-size:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check:size

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check:workflows

  windows-required:
    name: Codex Ops Windows
    if: always()
    needs: [dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          PLATFORMS: ${{ needs.dependencies.result }}
        run: test "$PLATFORMS" = success

  ci-required:
    timeout-minutes: 5
    name: CI required
    if: always()
    needs: [dependencies, source-size, workflow-lint, windows-required]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all four platforms and source checks
        env:
          PLATFORMS: ${{ needs.dependencies.result }}
          SOURCE: ${{ needs.source-size.result }}
          WORKFLOW: ${{ needs.workflow-lint.result }}
          WINDOWS: ${{ needs.windows-required.result }}
        run: test "$PLATFORMS" = success && test "$SOURCE" = success && test "$WORKFLOW" = success && test "$WINDOWS" = success
