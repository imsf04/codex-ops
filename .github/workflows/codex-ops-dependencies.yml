name: Codex Ops portable foundation
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-ops-portable-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    name: Codex Ops dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest, macos-15-intel]
    defaults:
      run:
        working-directory: packages/codex-ops
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --locked --no-dev
      - name: Import runtime dependencies
        run: uv run --locked --no-dev python -c "import grpc, mcp.server, pydantic; print('Runtime dependencies loaded')"
      - name: Check native binary selection
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_portable_binaries.py
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
            packages/codex-ops/rust-kernel/target
          key: codex-ops-portable-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'packages/codex-ops/rust-kernel/Cargo.lock') }}
      - name: Build and test native components
        shell: bash
        run: |
          cargo build --locked --release --manifest-path ../../native/Cargo.toml --bin dsh-ops-worker
          cargo test --locked --manifest-path rust-kernel/Cargo.toml
          cargo build --locked --release --manifest-path rust-kernel/Cargo.toml
      - name: Stage native components
        run: >-
          python -c "import os, pathlib, shutil; ext = '.exe' if os.name == 'nt' else ''; dest = pathlib.Path('bin'); dest.mkdir(exist_ok=True); shutil.copy2(pathlib.Path('../../native/target/release') / ('dsh-ops-worker' + ext), dest); shutil.copy2(pathlib.Path('rust-kernel/target/release') / ('codex-ops-kernel' + ext), dest)"
      - name: Build Windows launcher
        if: runner.os == 'Windows'
        run: rustc --edition 2024 -O runtime_bridge/shim.rs -o bin/codex-ops-cli.exe
      - name: Exercise native worker and kernel
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_portable_native.py
      - name: Check native kernel behavior and deadlines
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_v080_kernel.py
      - name: Check concurrent event accounting
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_v080_cost_events.py
      - name: Exercise MCP stdio server
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_portable_startup.py
      - name: Check process ancestry and runtime status
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_runtime_status.py
      - name: Check runtime discovery
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_v061_runtime_discovery.py
      - name: Check loopback relay with a configured HTTP proxy
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_grpc_relay_proxy.py
      - name: Check POSIX launcher lifecycle
        if: runner.os != 'Windows'
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_posix_launcher.py
      - name: Check hook behavior
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_hook_architecture.py
      - name: Check read-only snapshot safety
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_cache_reader.py
      - name: Check bundle assembly
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_portable_bundle.py
      - name: Fetch pinned Codex CLI for isolated installation
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Windows-X64) target=win32-x64 ;;
            Linux-X64) target=linux-x64 ;;
            macOS-ARM64) target=darwin-arm64 ;;
            macOS-X64) target=darwin-x64 ;;
            *) exit 1 ;;
          esac
          npm pack "@openai/codex@0.165.0-alpha.1-${target}" --pack-destination "$RUNNER_TEMP" --silent
      - name: Build and verify relocated preview bundle
        shell: bash
        run: uv run --locked --no-dev python tests/check_portable_bundle.py "$RUNNER_TEMP/codex-ops-preview" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        with:
          name: codex-ops-preview-${{ matrix.os }}
          path: ${{ runner.temp }}/codex-ops-preview/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: codex-ops-native-${{ matrix.os }}
          path: packages/codex-ops/bin/
          if-no-files-found: error
          retention-days: 7
