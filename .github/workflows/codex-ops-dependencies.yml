name: Codex Ops portable dependencies
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Codex Ops dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    defaults:
      run:
        working-directory: packages/codex-ops
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --locked --no-dev
      - name: Import runtime dependencies
        run: uv run --locked --no-dev python -c "import grpc, mcp.server, pydantic; print('Runtime dependencies loaded')"
      - name: Check native binary selection
        run: uv run --locked --no-dev python -m unittest discover -s tests -p test_portable_binaries.py
